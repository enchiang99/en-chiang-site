<script>
  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function playVideoCard(frame, e){
    var id = frame.getAttribute('data-yt');
    if(!id) return true;
    if(e) e.preventDefault();
    frame.innerHTML = '<iframe src="https://www.youtube.com/embed/' + id + '?autoplay=1" title="YouTube video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
    return false;
  }

  function applyFilter(){
    var mainCat = document.querySelector('.video-tab.active').dataset.cat;
    var subtagsWrap = document.querySelector('.video-subtags[data-owner="' + mainCat + '"]');
    var subCat = subtagsWrap ? (subtagsWrap.querySelector('.video-subtag.active') || {}).dataset : null;
    subCat = subCat ? subCat.subcat : 'all';

    document.querySelectorAll('.video-subtags').forEach(function(w){ w.classList.remove('visible'); });
    if(subtagsWrap && subtagsWrap.children.length) subtagsWrap.classList.add('visible');

    var cards = document.querySelectorAll('#videoGrid .video-card');
    var visibleCount = 0;
    cards.forEach(function(card){
      var matchCat = mainCat === 'all' || card.dataset.cat === mainCat;
      var matchSub = !subCat || subCat === 'all' || card.dataset.subcat === subCat;
      var show = matchCat && matchSub;
      card.style.display = show ? '' : 'none';
      if(show) visibleCount++;
    });
    document.getElementById('videoEmptyHint').style.display = visibleCount ? 'none' : 'block';
  }

  function selectMainCat(btn){
    document.querySelectorAll('.video-tab').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    applyFilter();
  }

  function selectSubCat(btn){
    var wrap = btn.closest('.video-subtags');
    wrap.querySelectorAll('.video-subtag').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    applyFilter();
  }

  function renderVideoGrid(html){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var srcGrid = doc.getElementById('videoGrid');
    if(!srcGrid) return;
    var cards = Array.from(srcGrid.querySelectorAll('.video-card'));
    if(!cards.length) return;

    var out = cards.map(function(card){
      var frame = card.querySelector('.video-thumb-frame');
      var img = card.querySelector('.video-cover');
      var meta = card.querySelector('.video-card-meta');
      var yt = frame ? frame.getAttribute('data-yt') : '';
      if(!yt) return '';
      var src = img ? img.getAttribute('src') : ('https://img.youtube.com/vi/' + yt + '/hqdefault.jpg');
      var altText = (meta ? meta.textContent.trim() : 'En Chiang 影片作品') + ' En Chiang 拍攝';
      var metaText = meta ? meta.textContent.trim() : '';
      return '<div class="video-card" data-cat="' + escapeHtml(card.dataset.cat || '') + '" data-subcat="' + escapeHtml(card.dataset.subcat || '') + '">' +
        '<a class="video-thumb-frame" data-yt="' + escapeHtml(yt) + '" href="https://youtu.be/' + escapeHtml(yt) + '" target="_blank" rel="noopener" onclick="return playVideoCard(this, event)">' +
        '<img class="video-cover" src="' + escapeHtml(src) + '" alt="' + escapeHtml(altText) + '">' +
        '<div class="video-play-overlay"></div></a>' +
        '<div class="video-card-meta">' + escapeHtml(metaText) + '</div></div>';
    }).join('');

    if(out.trim()){
      document.getElementById('videoGrid').innerHTML = out;
      applyFilter();
    }
  }

  /* 支援選單深連結，例如 business-video.html#cat=livehouse */
  (function(){
    var hash = location.hash.replace('#', '');
    var params = new URLSearchParams(hash.indexOf('cat=') === 0 ? hash : '');
    var cat = params.get('cat');
    if(cat){
      var tab = document.querySelector('.video-tab[data-cat="' + cat + '"]');
      if(tab) selectMainCat(tab);
    }
  })();

  applyFilter();

  var cached = sessionStorage.getItem('enchiang-index-cache');
  if(cached){
    renderVideoGrid(cached);
  } else {
    fetch('index.html')
      .then(function(r){ return r.text(); })
      .then(function(html){
        sessionStorage.setItem('enchiang-index-cache', html);
        renderVideoGrid(html);
      })
      .catch(function(){ /* 保留頁面原本就有的靜態內容，抓取失敗時不覆蓋 */ });
  }
</script>
