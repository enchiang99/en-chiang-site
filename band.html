<div class="photo-lightbox-overlay" id="photoLightbox" onclick="if(event.target===this) closePhotoLightbox();">
  <button type="button" class="photo-lightbox-close" onclick="closePhotoLightbox()">✕</button>
  <img id="photoLightboxImg" src="" alt="">
</div>

<script>
  function toggleTextSize(){
    var on = document.body.classList.toggle('text-large');
    localStorage.setItem('enchiang-text-large', on ? '1' : '0');
    var btn = document.querySelector('.float-textsize');
    if(btn) btn.classList.toggle('active', on);
  }
  if(localStorage.getItem('enchiang-text-large') === '1'){
    document.body.classList.add('text-large');
  }
  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.querySelector('.float-textsize');
    if(btn && localStorage.getItem('enchiang-text-large') === '1') btn.classList.add('active');
  });

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function openPhotoLightbox(src){
    if(!src) return;
    document.getElementById('photoLightboxImg').setAttribute('src', src);
    document.getElementById('photoLightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closePhotoLightbox(){
    document.getElementById('photoLightbox').classList.remove('open');
    document.getElementById('photoLightboxImg').setAttribute('src', '');
    document.body.style.overflow = '';
  }

  function renderCategoryList(html, groupName, listElId){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var group = doc.querySelector('.menu-group[data-group="' + groupName + '"] .menu-sublist');
    var list = document.getElementById(listElId);
    var links = group ? Array.from(group.querySelectorAll('a[href]')) : [];
    if(!links.length){
      list.innerHTML = '<div class="archive-empty">目前這個分類還沒有文章。</div>';
      return;
    }
    list.innerHTML = links.map(function(a){
      var href = a.getAttribute('href') || '#';
      if(href.charAt(0) === '#') href = 'index.html' + href;
      var title = a.textContent.trim();
      return '<a href="' + href + '" target="_blank" rel="noopener">' + title + '<span class="arrow">→</span></a>';
    }).join('');
  }

  /* 相簿：兩本一列，每本相簿自己是一個輪播 */
  function renderAlbumsGrid(html, containerId, targetElId){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var container = doc.getElementById(containerId);
    var target = document.getElementById(targetElId);
    if(!target) return;
    var albums = container ? Array.from(container.querySelectorAll('.biz-album')) : [];
    if(!albums.length) return; /* 保留頁面原本就有的靜態提示文字 */

    var cardsHtml = albums.map(function(album, albumIdx){
      var titleEl = album.querySelector('.album-title');
      var dateEl = album.querySelector('.album-date');
      var title = titleEl ? titleEl.textContent.trim() : '';
      var date = dateEl ? dateEl.textContent.trim() : '';
      var rawImgs = Array.from(album.querySelectorAll('.biz-filmstrip img, .biz-carousel-frame img'));
      var seen = {};
      var photos = rawImgs.filter(function(img){
        var src = img.getAttribute('src');
        if(!src || seen[src]) return false;
        seen[src] = true;
        return true;
      });
      if(!photos.length) return '';

      var imgsHtml = photos.map(function(img, i){
        var alt = img.getAttribute('alt') || title;
        var bwClass = img.classList.contains('bw-mode') ? ' bw-mode' : '';
        var activeClass = i === 0 ? ' active' : '';
        return '<img src="' + img.getAttribute('src') + '" alt="' + escapeHtml(alt) + '" class="' + (activeClass + bwClass).trim() + '" data-i="' + i + '" loading="lazy" onclick="openPhotoLightbox(this.src)">';
      }).join('');

      var arrows = photos.length > 1
        ? '<button type="button" class="carousel-arrow prev" onclick="staticCarouselNav(' + albumIdx + ',-1)">‹</button><button type="button" class="carousel-arrow next" onclick="staticCarouselNav(' + albumIdx + ',1)">›</button>'
        : '';

      var dotsHtml = photos.length > 1
        ? '<div class="static-carousel-dots">' + photos.map(function(_, i){
            return '<span class="static-carousel-dot' + (i === 0 ? ' active' : '') + '"></span>';
          }).join('') + '</div>'
        : '';

      return '<div class="static-album-card" data-album-idx="' + albumIdx + '">' +
        '<div class="album-date">' + escapeHtml(date) + '</div>' +
        '<div class="album-title">' + escapeHtml(title) + '</div>' +
        '<div class="static-carousel-frame">' + imgsHtml + arrows + '</div>' +
        dotsHtml +
        '</div>';
    }).join('');

    if(cardsHtml.trim()) target.innerHTML = '<div class="static-albums-grid">' + cardsHtml + '</div>';
  }

  function staticCarouselNav(albumIdx, dir){
    var card = document.querySelector('.static-album-card[data-album-idx="' + albumIdx + '"]');
    if(!card) return;
    var imgs = card.querySelectorAll('.static-carousel-frame img');
    var dots = card.querySelectorAll('.static-carousel-dot');
    if(!imgs.length) return;
    var curIdx = 0;
    imgs.forEach(function(img, i){ if(img.classList.contains('active')) curIdx = i; });
    var next = (curIdx + dir + imgs.length) % imgs.length;
    imgs.forEach(function(img, i){ img.classList.toggle('active', i === next); });
    dots.forEach(function(d, i){ d.classList.toggle('active', i === next); });
  }

  var cached = sessionStorage.getItem('enchiang-index-cache');
  if(cached){
    renderCategoryList(cached, 'about-daily', 'articleList');
    renderAlbumsGrid(cached, 'albums-post-3a5249b828338107b18eeb8c0f081131', 'dailyAlbums');
  } else {
    fetch('index.html')
      .then(function(r){ return r.text(); })
      .then(function(html){
        sessionStorage.setItem('enchiang-index-cache', html);
        renderCategoryList(html, 'about-daily', 'articleList');
        renderAlbumsGrid(html, 'albums-post-3a5249b828338107b18eeb8c0f081131', 'dailyAlbums');
      })
      .catch(function(){
        /* 保留頁面原本就有的靜態內容，抓取失敗時不覆蓋 */
      });
  }
</script>
