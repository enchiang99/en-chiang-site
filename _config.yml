title: "En Chiang｜台中人像寫真・樂團演出紀錄・寵物到府攝影"
description: "En Chiang，台中攝影師。拍攝台中人像寫真、樂團演出紀錄、寵物到府攝影。不擺拍、不制式，把故事拍成想珍藏的樣子。"
url: "https://enchiang.com"
# 2026-09-14：這是「正式版」設定——這份檔案是要覆蓋進 en-chiang-site（V1、已經綁 enchiang.com
# 這個正式網域）這個 repo 用的，所以 baseurl 改回空字串。
# 如果之後還要回到 en-chiang-site-v2 這個子路徑測試站繼續測，記得把這裡改回 "/en-chiang-site-v2"，
# 兩種情境是互斥的，同一份 _config.yml 沒辦法讓兩種網址同時正常。
baseurl: ""
lang: zh-Hant
# 分享到 FB／LINE／IG 時顯示的預設縮圖，跟原網站一致
image: /images/hero.jpeg
twitter:
  card: summary_large_image

markdown: kramdown
permalink: /:categories/:title/

collections:
  about_en:
    output: true
    permalink: /about-en/:slug/
  about_daily:
    output: true
    permalink: /about-daily/:slug/
  about_love:
    output: true
    permalink: /about-love/:slug/

defaults:
  - scope:
      path: ""
      type: about_en
    values:
      layout: article
      menu_group: about-en
  - scope:
      path: ""
      type: about_daily
    values:
      layout: article
      menu_group: about-daily
  - scope:
      path: ""
      type: about_love
    values:
      layout: article
      menu_group: journal

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - incoming-zips
  - .github
  - scripts
  - CHANGELOG-2026-09-12.md
