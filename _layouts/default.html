<!-- 2026-09-14：JSON-LD 結構化資料，告訴 Google／AI 搜尋引擎「這是誰、提供哪些服務」，
     內容跟 V1 正式站原本的設定一致，但 IG 連結／Email 改成直接讀後台「聯繫方式」欄位，
     以後在後台改這兩個欄位，這裡會自動跟著更新，不用另外改程式碼。 -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "En Chiang",
  "jobTitle": "攝影師",

  "url": "{{ site.url }}/",

    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "台中人像寫真", "url": "{{ site.url }}/portrait/" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "台中樂團演出紀錄", "url": "{{ site.url }}/band/" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "台中寵物到府攝影", "url": "{{ site.url }}/pet/" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "商業創意平面攝影", "url": "{{ site.url }}/business-brand.html" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "商業人像攝影", "url": "{{ site.url }}/business-portrait.html" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "商業影片製作", "url": "{{ site.url }}/business-video.html" } }
  ]
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
</head>
<body>

{% include nav.html %}
{% include floating-buttons.html %}

{{ content }}

{% include footer.html %}

<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
  /* ---------- 選單開關 ---------- */
  function toggleMenu(){
    var btn = document.getElementById('menuBtn');
    var panel = document.getElementById('menuPanel');
    /* 以 panel 目前狀態為準，兩個元素一起設成同一個目標狀態，
       避免因為重複觸發等情況讓按鈕圖示跟選單面板的開關狀態兜不起來 */
    var opening = !panel.classList.contains('open');
    btn.classList.toggle('open', opening);
    panel.classList.toggle('open', opening);
  }

  /* ---------- 選單：主項目／子項目手風琴 ----------
     點「主項目本身」或旁邊的箭頭都可以展開，兩者共用同一個開關，
     展開後文章清單、相簿清單會一起滑出來（見 CSS .menu-group-body） */
  function toggleMenuGroup(el){
    var group = el.closest('.menu-group');
    if(!group) return;
    var head = group.querySelector('.menu-group-head');
    var body = group.querySelector('.menu-group-body');
    if(!head || !body) return;
    var opening = !head.classList.contains('open');
    head.classList.toggle('open', opening);
    body.classList.toggle('open', opening);
    /* 直接用 JS 算實際內容高度來設定展開高度：
       有些頁面（相簿、圖片較多）光靠 CSS 的 max-height class 有時不會正確套用，改用這個方式保險 */
    if(opening){
      body.style.maxHeight = body.scrollHeight + 'px';
    } else {
      body.style.maxHeight = '';
    }
  }

  /* ---------- 選單：關於商業／影音 的子分類展開 ---------- */
  function toggleMenuVideoSub(e){
    e.preventDefault();
    e.stopPropagation();
    var toggleEl = document.getElementById('menuVideoToggle');
    var panelEl = document.getElementById('menuVideoSubpanel');
    var opening = !toggleEl.classList.contains('open');
    toggleEl.classList.toggle('open', opening);
    panelEl.classList.toggle('open', opening);
    if(opening){
      panelEl.style.maxHeight = panelEl.scrollHeight + 'px';
    } else {
      panelEl.style.maxHeight = '';
    }
  }

  /* ---------- 文字放大（跟舊版共用同一組 localStorage key） ---------- */
  function toggleTextSize(){
    var on = document.body.classList.toggle('text-large');
    localStorage.setItem('enchiang-text-large', on ? '1' : '0');
    var btn = document.querySelector('.float-textsize');
    if(btn) btn.classList.toggle('active', on);
  }
  (function(){
    if(localStorage.getItem('enchiang-text-large') === '1'){
      document.body.classList.add('text-large');
      document.addEventListener('DOMContentLoaded', function(){
        var btn = document.querySelector('.float-textsize');
        if(btn) btn.classList.add('active');
      });
    }
  })();

  /* ---------- 選單按鈕：不論手機或電腦，一進站就常駐顯示 ---------- */
  (function(){
    var menuBtn = document.getElementById('menuBtn');
    if(!menuBtn) return;
    menuBtn.classList.add('visible');
  })();

  /* ---------- 相簿輪播（共用）：任何頁面只要有 .album-carousel 就會生效 ----------
     有加 data-autoplay="毫秒數" 屬性才會自動播放（例如文章內頁的相簿）；
     沒有加這個屬性就是純手動（例如關於商業的創意平面／影像），
     一律從第一張開始，不會自己跳到別張，只有點左右箭頭／小圓點才會換頁 */
  (function(){
    /* 相簿照片：除了第一張以外，其餘照片先用 data-src 存著網址、不會馬上下載，
       真的滑到那一張才把 data-src 換成 src、瀏覽器才會真的去抓這張圖，
       這樣一個相簿裡沒被看到的照片就不會白白佔頻寬、拖慢整頁載入速度 */
    function loadSlideImage(slide){
      if(!slide) return;
      var img = slide.querySelector('img[data-src]');
      if(img){
        img.src = img.getAttribute('data-src');
        img.removeAttribute('data-src');
      }
      /* 照片專屬的動態效果（影片）也用同一招延遲載入，滑到那張才真的開始播放 */
      var iframe = slide.querySelector('iframe[data-src]');
      if(iframe){
        iframe.src = iframe.getAttribute('data-src');
        iframe.removeAttribute('data-src');
      }
    }
    function setup(carousel){
      var track = carousel.querySelector('.album-carousel-track');
      var slides = carousel.querySelectorAll('.album-carousel-slide');
      var dots = carousel.querySelectorAll('.album-carousel-dot');
      var index = 0;
      var hasAutoplay = carousel.hasAttribute('data-autoplay');
      var delay = hasAutoplay ? (parseInt(carousel.getAttribute('data-autoplay'), 10) || 4500) : 0;
      var timer = null;

      function render(){
        track.style.transform = 'translateX(-' + (index * 100) + '%)';
        dots.forEach(function(d, i){ d.classList.toggle('active', i === index); });
      }
      function goTo(i){
        index = (i + slides.length) % slides.length;
        loadSlideImage(slides[index]);
        var nextSlide = slides[(index + 1) % slides.length];
        if(nextSlide) loadSlideImage(nextSlide); // 預先載入下一張，切換時比較不會有空白
        render();
      }
      function next(){ goTo(index + 1); }
      function resetTimer(){
        if(timer) clearInterval(timer);
        if(delay > 0 && slides.length > 1) timer = setInterval(next, delay);
      }

      carousel._albumCarousel = { goTo: goTo, next: next, resetTimer: resetTimer };
      render();
      resetTimer();
      if(slides.length > 1) enableDrag(carousel, track, slides, function(){ return index; }, goTo, function(){
        /* 使用者自己動手滑過之後，就不再自動播放，避免跟手指搶 */
        delay = 0; if(timer){ clearInterval(timer); timer = null; }
      });
    }
    /* ---------- 2026-09-26：拖曳／手指滑動 ----------
       1. 照片跟著手指 1:1 移動（從抓住的位置開始算，不會跳）
       2. 放開時看速度：輕輕一甩就換下一張，慢慢拖要超過一半才換
       3. 第一張往右拉、最後一張往左拉會有阻力（橡皮筋），不會直接撞牆
       4. 動畫從照片「目前的位置」接著走，中途可以再抓住 */
    /* 翻頁用較快的減速率（0.99），滑鼠滾動那種 0.998 對單張翻頁太敏感 */
    function project(v){ var d = 0.99; return (v / 1000) * d / (1 - d); }
    function rubberband(x, dim){ var c = 0.55; return (x * dim * c) / (dim + c * Math.abs(x)); }
    function enableDrag(carousel, track, slides, getIndex, goTo, onUserSwipe){
      var startX = 0, startY = 0, dx = 0, width = 0, dragging = false, decided = false, pid = null, moved = false;
      var hist = [];
      function currentOffset(){
        var m = getComputedStyle(track).transform;
        if(!m || m === 'none') return 0;
        return new DOMMatrixReadOnly(m).m41;
      }
      carousel.addEventListener('pointerdown', function(e){
        if(e.button !== 0 || e.target.closest('.album-carousel-btn, .album-carousel-dot, iframe')) return;
        width = carousel.clientWidth;
        /* 從畫面上「現在」的位置接手，動畫跑到一半也能直接抓住 */
        var live = currentOffset();
        startX = e.clientX - (live + getIndex() * width);
        startY = e.clientY; dx = live + getIndex() * width;
        dragging = true; decided = false; moved = false; pid = e.pointerId;
        hist = [{ x: e.clientX, t: e.timeStamp }];
        carousel.classList.add('is-dragging');
        track.style.transform = 'translateX(' + (-getIndex() * width + dx) + 'px)';
      });
      carousel.addEventListener('pointermove', function(e){
        if(!dragging || e.pointerId !== pid) return;
        var ddx = e.clientX - startX, ddy = e.clientY - startY;
        if(!decided){
          if(Math.abs(ddx) < 10 && Math.abs(ddy) < 10) return;
          decided = true;
          if(Math.abs(ddy) > Math.abs(ddx) && e.pointerType !== 'mouse'){ cancel(); return; }
          try{ carousel.setPointerCapture(pid); }catch(err){}
          onUserSwipe();
        }
        moved = true;
        dx = ddx;
        var i = getIndex(), last = slides.length - 1;
        var shown = dx;
        if(i === 0 && dx > 0) shown = rubberband(dx, width);
        if(i === last && dx < 0) shown = -rubberband(-dx, width);
        track.style.transform = 'translateX(' + (-i * width + shown) + 'px)';
        hist.push({ x: e.clientX, t: e.timeStamp });
        if(hist.length > 5) hist.shift();
      });
      function cancel(){
        dragging = false; carousel.classList.remove('is-dragging');
        track.style.transform = 'translateX(-' + (getIndex() * 100) + '%)';
      }
      function end(e){
        if(!dragging || e.pointerId !== pid) return;
        dragging = false;
        carousel.classList.remove('is-dragging');
        /* 只看放開前 100ms 內的移動來算速度；停住再放開就等於沒有甩 */
        var recent = hist.filter(function(h){ return e.timeStamp - h.t <= 100; });
        var a = recent[0], b = recent[recent.length - 1];
        var v = (b && a && b.t > a.t) ? (b.x - a.x) / (b.t - a.t) * 1000 : 0; /* px/s */
        var landing = dx + project(v);
        var i = getIndex(), target = i;
        if(landing < -width / 2) target = i + 1;
        else if(landing > width / 2) target = i - 1;
        target = Math.max(0, Math.min(slides.length - 1, target));
        /* 甩得越快，收尾越短 */
        var remain = Math.abs((target - i) * width - dx);
        var dur = Math.max(180, Math.min(420, remain / Math.max(Math.abs(v), 1) * 1000 * 1.6));
        track.style.transition = 'transform ' + dur + 'ms cubic-bezier(.2,.8,.2,1)';
        goTo(target);
        setTimeout(function(){ track.style.transition = ''; }, dur + 20);
      }
      carousel.addEventListener('dragstart', function(e){ e.preventDefault(); });
      carousel.addEventListener('pointerup', end);
      carousel.addEventListener('pointercancel', end);
      /* 拖曳結束時不要誤觸點照片開燈箱 */
      carousel.addEventListener('click', function(e){
        if(moved){ e.stopPropagation(); e.preventDefault(); moved = false; }
      }, true);
    }

    document.querySelectorAll('.album-carousel').forEach(setup);
  })();

  function albumCarouselMove(btn, dir){
    var carousel = btn.closest('.album-carousel');
    if(!carousel || !carousel._albumCarousel) return;
    var activeDot = carousel.querySelector('.album-carousel-dot.active');
    var currentIndex = activeDot ? Array.prototype.indexOf.call(carousel.querySelectorAll('.album-carousel-dot'), activeDot) : 0;
    carousel._albumCarousel.goTo(currentIndex + dir);
    carousel._albumCarousel.resetTimer();
  }
  function albumCarouselGoTo(dot, i){
    var carousel = dot.closest('.album-carousel');
    if(!carousel || !carousel._albumCarousel) return;
    carousel._albumCarousel.goTo(i);
    carousel._albumCarousel.resetTimer();
  }

  /* ---------- MOTION：捲動淡入（AOS，只剩引言在用） ---------- */
  (function(){
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion) return;
    /* 2026-09-26：拿掉 Lenis 平滑捲動——它會接管滾輪，畫面跟手指／滾輪不再同步 */
    if(typeof AOS !== 'undefined'){
      try{ AOS.init({ duration: 500, once: true, offset: 40, easing: 'ease-out-cubic' }); }catch(e){}
    }
  })();

  /* ---------- 首頁 HERO 進場：掀開簾幕（2026-09-26：拿掉逐字浮現，只留一個進場效果） ---------- */
  (function(){
    var hero = document.getElementById('hero');
    if(!hero) return;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion) return;
    var curtain = document.createElement('div');
    curtain.className = 'hero-curtain';
    hero.appendChild(curtain);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ curtain.classList.add('is-done'); });
    });
    setTimeout(function(){ if(curtain.parentNode) curtain.parentNode.removeChild(curtain); }, 900);
  })();
</script>
</body>
</html>
