<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<meta name="theme-color" content="#241a12">
<!-- Google tag (gtag.js) — 跟原網站同一組 GA 追蹤 ID，換後台不會中斷數據 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6NLCEX26ZX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-6NLCEX26ZX');
</script>
{% seo title=false %}
<title>{% if page.title %}{{ page.title }}｜{% endif %}{{ site.title }}</title>
<!-- 2026-09-14：JSON-LD 結構化資料，告訴 Google／AI 搜尋引擎「這是誰、提供哪些服務」，
     內容跟 V1 正式站原本的設定一致，但 IG 連結／Email 改成直接讀後台「聯繫方式」欄位，
     以後在後台改這兩個欄位，這裡會自動跟著更新，不用另外改程式碼。 -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "En Chiang",
  "jobTitle": "攝影師",
  "areaServed": "台中市",
  "url": "{{ site.url }}/",
  "sameAs": ["{{ site.data.site.footer.ig_link }}"],
  "email": "{{ site.data.site.footer.email }}",
  "makesOffer": [
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "台中人像寫真", "url": "{{ site.url }}/portrait/" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "台中樂團演出紀錄", "url": "{{ site.url }}/band/" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "台中寵物到府攝影", "url": "{{ site.url }}/pet/" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "商業創意平面攝影", "url": "{{ site.url }}/business-brand.html" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "商業人像攝影", "url": "{{ site.url }}/business-portrait.html" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "商業影片製作", "url": "{{ site.url }}/business-video.html" } }
  ]
}
</script>
<link rel="preload" href="{{ '/assets/diary-hand.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/diary-paper.webp' | relative_url }}" as="image" type="image/webp">
<link rel="stylesheet" href="{{ '/assets/diary.css' | relative_url }}">
</head>
<body class="diary-body">
{{ content }}
<div id="diary" class="diary is-single" aria-label="EN 的日記本"></div>
<script src="{{ '/assets/diary.js' | relative_url }}" defer></script>
</body>
</html>
