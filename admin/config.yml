backend:
  name: github
  # 2026-09-14：正式版設定——已經改回正式站的 repo，這份檔案要覆蓋進 en-chiang-site 用。
  # base_url 不用改，同一個 Cloudflare Worker 只是幫忙處理 GitHub 登入，跟填哪個 repo 無關。
  repo: enchiang99/en-chiang-site
  branch: main
  base_url: https://enchiang-cms-auth-v2.en-hi-light.workers.dev

site_url: https://enchiang.com
publish_mode: simple
media_folder: "images"
public_folder: "/images"

collections:
  - name: "site"
    label: "首頁內容"
    files:
      - name: "site"
        label: "首頁各區塊文字"
        file: "_data/site.yml"
        fields:
          - label: "Hero 大圖"
            name: "hero"
            widget: object
            fields:
              - { label: "圖片", name: "image", widget: image }
              - { label: "圖片替代文字（SEO用）", name: "image_alt", widget: string }
              - { label: "小標籤", name: "label", widget: string }
              - { label: "標題第一行", name: "title_line1", widget: string }
              - { label: "標題第二行", name: "title_line2", widget: string }
              - { label: "按鈕文字", name: "cta_text", widget: string }
              - { label: "按鈕連結", name: "cta_link", widget: string }
          - label: "引言（關於EN）"
            name: "quote"
            widget: object
            fields:
              - { label: "引言主文", name: "text", widget: string }
              - label: "描述（可以直接打好幾行，存檔後會自動一行一段，不用像以前分開一格一格輸入）"
                name: "desc"
                widget: text
          - label: "關於我／關於所有（已合併，三張卡片）"
            name: "about_daily"
            widget: object
            fields:
              - { label: "小標籤", name: "label", widget: string }
              - { label: "標題", name: "heading", widget: string }
              - label: "三張服務卡"
                name: "services"
                widget: list
                fields:
                  - { label: "編號", name: "num", widget: string }
                  - { label: "分類標籤（例如 [About En]）", name: "category", widget: string, required: false }
                  - { label: "標題", name: "title", widget: string }
                  - { label: "連結（連到哪篇文章）", name: "link", widget: string, required: false }
                  - { label: "副標", name: "tagline", widget: string }
                  - label: "描述（可以直接打好幾行，存檔後會自動一行一段）"
                    name: "desc_text"
                    widget: text
          - label: "頁尾聯繫方式"
            name: "footer"
            widget: object
            fields:
              - { label: "小標籤", name: "label", widget: string }
              - { label: "標題", name: "heading", widget: string }
              - { label: "IG 顯示文字", name: "ig_handle", widget: string }
              - { label: "IG 連結網址", name: "ig_link", widget: string }
              - { label: "Email", name: "email", widget: string }
              - { label: "版權文字", name: "copyright", widget: string }
              - { label: "版權旁邊的標語", name: "tagline", widget: string }
          - label: "首頁商業精選（原本的「最新消息」，改成關於商業的精選作品）"
            name: "recent_shoots"
            widget: object
            hint: "這一區在首頁靠下方，用來精選幾張你想主打的商業作品。圖片、文字都自己選，選完會顯示在首頁，並附一個連到「關於商業」整頁的按鈕。"
            fields:
              - { label: "小標籤", name: "label", widget: string }
              - { label: "標題", name: "heading", widget: string }
              - { label: "按鈕文字（連到關於商業整頁，例如「查看更多」）", name: "more_text", widget: string, required: false }
              - { label: "按鈕連結", name: "more_link", widget: string, required: false, hint: "通常填 /business/，或某個分類錨點，例如 /business/#biz-brand" }
              - label: "精選作品（建議 3～6 張，自己選要放哪幾張、寫什麼文字）"
                name: "items"
                widget: list
                fields:
                  - { label: "照片", name: "image", widget: image }
                  - { label: "說明文字", name: "caption", widget: string }
                  - { label: "點這張圖要連去哪裡（選填，例如某個商業作品的相簿頁）", name: "link", widget: string, required: false }

  # ---------- 📦 整批上傳照片：專門放這個，不用再去 images 資料夾裡找相簿名稱複製連結 ----------
  - name: "batch_upload"
    label: "📦 整批上傳照片（zip，自動解壓縮）"
    files:
      - name: "batch"
        label: "上傳新的一批照片"
        file: "_data/uploads-log.yml"
        fields:
          - label: "上傳紀錄"
            name: "batches"
            widget: list
            required: false
            hint: >
              把一整批照片先壓成一個 zip（不用先解壓縮），按下面「Add」上傳。存檔、發布之後，
              等 1～2 分鐘讓 GitHub 自動處理完（可以到 GitHub 網頁的 Actions 分頁看有沒有變成綠勾勾），
              這批照片就會自動進到 images/ 資料夾。之後不管是「關於EN／日常／愛」的相簿，
              還是「關於商業」的相簿，只要點照片欄位的「Choose an image」，就能直接從縮圖清單挑剛剛上傳的照片，
              不用再手動去 images 資料夾找檔名、複製網址。
            fields:
              - label: "zip 檔案"
                name: "zip_file"
                widget: file
                media_folder: "/incoming-zips"
                public_folder: "/incoming-zips"
              - { label: "備註（選填，方便自己識別是哪一批，例如「9月樂團拍攝」）", name: "note", widget: string, required: false }

  # ---------- 以下三個 collection，就是選單裡「關於EN／關於日常／關於愛」底下的子文章 ----------
  - name: "about_en"
    label: "關於 EN（子文章）"
    folder: "_about_en"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields: &article_fields
      - { label: "標題", name: "title", widget: string }
      - { label: "日期", name: "date", widget: datetime }
      - { label: "日期顯示文字（例如 2026.07）", name: "date_label", widget: string, required: false }
      - { label: "封面圖（選填）", name: "cover_image", widget: image, required: false }
      - { label: "YouTube 影片 ID（選填，例如 EhFTsiG-W5g）", name: "video_id", widget: string, required: false }
      - { label: "內文", name: "body", widget: markdown }
      - label: "圖片相簿（選填，可以有好幾組）"
        name: "albums"
        widget: list
        required: false
        summary: "{{fields.title}}"
        collapsed: true
        fields:
          - { label: "相簿標題", name: "title", widget: string, required: false }
          - { label: "外部連結（選填）", name: "link", widget: string, required: false }
          - label: "照片"
            name: "photos"
            widget: list
            summary: "{{fields.caption}}"
            collapsed: true
            fields:
              - { label: "照片", name: "src", widget: image }
              - { label: "說明文字（選填）", name: "caption", widget: string, required: false }

  - name: "about_daily"
    label: "關於日常（子文章）"
    folder: "_about_daily"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields: *article_fields

  - name: "about_love"
    label: "關於愛（子文章）"
    folder: "_about_love"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields: *article_fields

  # ---------- 關於商業：四個真實分類，各對應一個資料檔，架構完全比照原網站 ----------
  - name: "business"
    label: "關於商業"
    files:
      - name: "brand-design"
        label: "① 創意平面 Creative Graphics"
        file: "_data/business/brand-design.yml"
        fields: &photo_biz_fields
          - label: "子分類標籤（例如 美髮／餐飲）"
            name: "categories"
            widget: list
            summary: "{{fields.label}}"
            collapsed: true
            fields:
              - { label: "顯示名稱（新增分類只需要填這個）", name: "label", widget: string }
              - { label: "代碼（內部使用，不會顯示，不用理會）", name: "id", widget: hidden, required: false }
          - label: "相簿"
            name: "albums"
            widget: list
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - { label: "相簿標題", name: "title", widget: string }
              - { label: "屬於哪個子分類（直接填上面打的「顯示名稱」文字即可，一字不差）", name: "category", widget: string, required: false }
              - { label: "外部連結（選填，例如 IG）", name: "link", widget: string, required: false }
              - label: "照片"
                name: "photos"
                widget: list
                summary: "{{fields.caption}}"
                collapsed: true
                fields:
                  - { label: "照片", name: "src", widget: image }
                  - { label: "說明文字（選填）", name: "caption", widget: string, required: false }

      - name: "ai-automation"
        label: "② AI自動化｜AI Automation"
        file: "_data/business/ai-automation.yml"
        fields:
          - label: "子分類標籤"
            name: "categories"
            widget: list
            summary: "{{fields.label}}"
            collapsed: true
            fields:
              - { label: "顯示名稱（新增分類只需要填這個）", name: "label", widget: string }
              - { label: "代碼（內部使用，不會顯示，不用理會）", name: "id", widget: hidden, required: false }
          - label: "相簿"
            name: "albums"
            widget: list
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - { label: "相簿標題", name: "title", widget: string }
              - { label: "屬於哪個子分類（直接填上面打的「顯示名稱」文字即可，一字不差）", name: "category", widget: string, required: false }
              - { label: "立即查看（主要連結，選填）", name: "link", widget: string, required: false }
              - label: "社群圖示（IG／YT／TikTok／FB／Threads，各自可設定連結）"
                name: "social_links"
                widget: list
                required: false
                summary: "{{fields.platform}}"
                collapsed: true
                hint: "哪一個平台的「連結」欄位是空的，前台就不會顯示那顆圖示。"
                fields:
                  - label: "平台"
                    name: "platform"
                    widget: select
                    options:
                      - { label: "Instagram", value: "instagram" }
                      - { label: "YouTube", value: "youtube" }
                      - { label: "TikTok", value: "tiktok" }
                      - { label: "Facebook", value: "facebook" }
                      - { label: "Threads", value: "threads" }
                  - { label: "連結", name: "url", widget: string, required: false }
              - label: "照片"
                name: "photos"
                widget: list
                summary: "{{fields.caption}}"
                collapsed: true
                fields:
                  - { label: "照片", name: "src", widget: image }
                  - { label: "說明文字（選填）", name: "caption", widget: string, required: false }

      - name: "brand"
        label: "③ 影像 Photography（形象／醫療／餐飲／婚禮／花藝）"
        file: "_data/business/brand.yml"
        fields: *photo_biz_fields

      - name: "video"
        label: "④ 影音 Video（餐廳／醫療／文創）"
        file: "_data/business/video.yml"
        fields:
          - label: "分類（餐廳／醫療／文創）"
            name: "categories"
            widget: list
            summary: "{{fields.label}}"
            collapsed: true
            fields:
              - { label: "顯示名稱（新增分類只需要填這個）", name: "label", widget: string }
              - { label: "代碼（內部使用，不會顯示，不用理會）", name: "id", widget: hidden, required: false }
          - label: "影片"
            name: "videos"
            widget: list
            summary: "{{fields.caption}}"
            collapsed: true
            fields:
              - { label: "YouTube 影片 ID（網址 v= 後面那串）", name: "youtube_id", widget: string }
              - { label: "說明文字", name: "caption", widget: string, required: false }
              - { label: "屬於哪個分類（直接填分類的「顯示名稱」文字即可，一字不差）", name: "category", widget: string, required: false }
