quote:
  text: 嘿，你相信許願嗎？
  # 2026-09-12：從「一行一句」的清單，改成一個可以整塊編輯的文字框，後台直接看得到完整內容。
  desc: |
    長大後，才變得像個小孩。
    無數地跌宕起伏，就像海浪。
    有時沉溺、有時站在浪尖，
    不成為勇敢的人，成為設置停損點的人。
    讓經過你的所有事物都是流動的。
