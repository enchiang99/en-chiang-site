name: Auto-update images/README.md

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '!images/README.md'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (含完整 git 歷史，才能查每個檔案的上傳日期)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 產生 images/README.md
        run: node scripts/gen-images-readme.js

      - name: 若有變動則自動提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/README.md
          git diff --staged --quiet || git commit -m "chore: auto-update images/README.md [skip ci]"
          git push
