name: Omega Publish Confirmed

on:
  repository_dispatch:
    types: [publish_confirmed]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝 Python 套件
        run: pip install requests

      - name: 讀取待發布狀態、把影片抓回來(第一階段:先驗證機制)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'PYEOF'
          import json, os, requests

          with open(".pending_publish.json", encoding="utf-8") as f:
              state = json.load(f)

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          r = requests.get(f"https://api.telegram.org/bot{token}/getFile",
                            params={"file_id": state["video_file_id"]})
          r.raise_for_status()
          file_path = r.json()["result"]["file_path"]
          download_url = f"https://api.telegram.org/file/bot{token}/{file_path}"
          video = requests.get(download_url, timeout=120)
          with open("confirmed_video.mp4", "wb") as f:
              f.write(video.content)

          size_mb = len(video.content) / 1024 / 1024
          print(f"成功抓回影片,大小 {size_mb:.1f}MB")

          msg = (
              f"✅ 確認機制測試成功！\n\n"
              f"已收到你的發布確認,影片也成功從Telegram抓回來了(大小{size_mb:.1f}MB)。\n\n"
              f"下一階段會接上YouTube/Instagram/TikTok真正的發布功能。"
          )
          requests.post(f"https://api.telegram.org/bot{token}/sendMessage",
                        data={"chat_id": chat_id, "text": msg})
          PYEOF
