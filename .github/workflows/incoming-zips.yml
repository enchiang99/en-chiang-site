name: 整批照片自動解壓縮＋壓縮

# 觸發時機：
# 1) incoming-zips/ 資料夾有變動（透過 /admin/ 後台上傳了一個新 zip）
# 2) images/ 資料夾有變動（後台直接上傳單張照片，也會自動壓縮）
# 也可以到 GitHub 網頁的 Actions 分頁手動點「Run workflow」重新跑一次。
#
# 2026-09-12 新增：images/** 也會觸發，且加了 npm install sharp 這個壓縮套件，
# 讓「後台單張上傳」跟「整批 zip 上傳」的照片都會自動轉 JPEG、限制最長邊 1600px、
# 統一壓縮品質，不會再發生上傳原始大檔拖慢網頁的狀況。
#
# 2026-11-09 修正：
# - 這個檔案原本放在 repo 最外層，GitHub 只會執行 .github/workflows/ 裡的流程，所以之前一直沒有在跑，
#   現在搬到 .github/workflows/incoming-zips.yml。
# - 只壓縮「這次新上傳的照片」，舊照片不碰；而且永遠不改檔名（舊版會把 PNG 改成 .jpg，文章裡的圖就會壞掉）。
# - 想把全部舊照片重新壓縮一次：Actions → 這個流程 → Run workflow → 勾「optimize_all」。
#
# ⚠️ if: github.actor != 'github-actions[bot]' 這一行很重要：
# 因為這個流程自己也會 commit 回 images/，如果沒有這個判斷，
# 自己 commit 的結果又會觸發自己一次，變成無限循環。
#
# 2026-11-23 修正：這個檔案一直缺了下面整段 jobs，所以語法一修好，
# GitHub 馬上又報「Required property is missing: jobs」——代表這個流程從來沒有真的跑過。
# 這段 jobs 是照 scripts/process-incoming-zips.js 和 scripts/lib/image-optimizer.js
# 兩個檔案目前的程式碼邏輯，以及上面這些註解描述的行為（npm install sharp、
# NEW_IMAGES_FILE、OPTIMIZE_ALL、github-actions[bot] 防無限循環）重新補上的。
# 建議上傳後找一張小照片測試一次，確認真的有跑、有自動 commit 回來。
on:
  push:
    branches: [main]
    paths:
      - "incoming-zips/**"
      - "images/**"
  workflow_dispatch:
    inputs:
      optimize_all:
        description: "把 images/ 裡全部舊照片也重新壓縮一次（檔名不會改）"
        type: boolean
        default: false

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        run: npm install sharp

      - name: 算出這次 push 新增到 images/ 的照片清單
        if: github.event_name == 'push'
        run: |
          git diff --name-only --diff-filter=A "${{ github.event.before }}" "${{ github.sha }}" \
            > /tmp/new-images.txt || true
          echo "NEW_IMAGES_FILE=/tmp/new-images.txt" >> "$GITHUB_ENV"

      - name: 解壓縮 zip／壓縮新照片
        env:
          OPTIMIZE_ALL: ${{ github.event.inputs.optimize_all || 'false' }}
        run: node scripts/process-incoming-zips.js

      - name: 把處理結果 commit 回去
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/ incoming-zips/
          if git diff --cached --quiet; then
            echo "沒有變動，不用 commit。"
          else
            git commit -m "自動處理：解壓縮／壓縮照片"
            git push
          fi
