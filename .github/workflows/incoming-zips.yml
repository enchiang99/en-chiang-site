name: 整批照片自動解壓縮＋壓縮

# 觸發時機：
# 1) incoming-zips/ 資料夾有變動（透過 /admin/ 後台上傳了一個新 zip）
# 2) images/ 資料夾有變動（後台直接上傳單張照片，也會自動壓縮）
# 也可以到 GitHub 網頁的 Actions 分頁手動點「Run workflow」重新跑一次。
#
# 2026-09-12 新增：images/** 也會觸發，且加了 npm install sharp 這個壓縮套件，
# 讓「後台單張上傳」跟「整批 zip 上傳」的照片都會自動轉 JPEG、限制最長邊 1600px、
# 統一壓縮品質，不會再發生上傳原始大檔拖慢網頁的狀況。
#
# 2026-11-09 修正：
# - 這個檔案原本放在 repo 最外層，GitHub 只會執行 .github/workflows/ 裡的流程，所以之前一直沒有在跑，
#   現在搬到 .github/workflows/incoming-zips.yml。
# - 只壓縮「這次新上傳的照片」，舊照片不碰；而且永遠不改檔名（舊版會把 PNG 改成 .jpg，文章裡的圖就會壞掉）。
# - 想把全部舊照片重新壓縮一次：Actions → 這個流程 → Run workflow → 勾「optimize_all」。
#
# ⚠️ if: github.actor != 'github-actions[bot]' 這一行很重要：
# 因為這個流程自己也會 commit 回 images/，如果沒有這個判斷，
# 自己 commit 的結果又會觸發自己一次，變成無限循環。
on:
  push:
    branches: [main]
    paths:
      - "incoming-zips/**"
      - "images/**"
  workflow_dispatch:
    inputs:
      optimize_all:
        description: "把 images/ 裡全部舊照片也重新壓縮一次（檔名不會改）"
      %
